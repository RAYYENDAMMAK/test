apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcf
  template:
    metadata:
      labels:
        app: pcf
    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb-svc 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: pcf
          image: open5gs:local
          imagePullPolicy: Never
          command: ["open5gs-pcfd", "-c", "/etc/open5gs/pcf.yaml"]
          ports:
            - containerPort: 7777
          volumeMounts:
            - name: pcf-config
              mountPath: /etc/open5gs/pcf.yaml
              subPath: pcf.yaml
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: pcf-config
          configMap:
            name: pcf-config
