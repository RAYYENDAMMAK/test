apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcf
  template:
    metadata:
      labels:
        app: pcf
    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z 192.168.1.102 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: pcf
          image: open5gs:local
          imagePullPolicy: Never
          command: ["/bin/sh", "/etc/open5gs/run.sh"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 7777
          volumeMounts:
            - name: pcf-config
              mountPath: /etc/open5gs
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: pcf-config
          hostPath:
            path: /home/rayen/ieee_5g_core/pcf
            type: Directory
