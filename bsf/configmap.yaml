apiVersion: v1
kind: ConfigMap
metadata:
  name: bsf-config
  namespace: open5gs
data:
  bsf.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/bsf.log
      level: info

    bsf:
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
        client:
          scp:
            - uri: http://${SCP_IP}:7777

    db_uri: mongodb://mongodb-svc.open5gs.svc.cluster.local/open5gs
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    SCP_IP="$(getent ahostsv4 scp-svc | awk 'NR==1 {print $1}')"
    sed "s/\${POD_IP}/${POD_IP}/g; s/\${SCP_IP}/${SCP_IP}/g" /etc/open5gs/bsf.yaml.in > /tmp/bsf.yaml
    exec open5gs-bsfd -c /tmp/bsf.yaml
