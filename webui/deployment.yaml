apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      initContainers:
        - name: wait-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb-svc 27017; do echo waiting for mongodb; sleep 2; done']
      containers:
        - name: webui
          image: gradiant/open5gs-webui:latest
          ports:
            - containerPort: 9999
          env:
            - name: DB_URI
              value: mongodb://mongodb-svc/open5gs
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
