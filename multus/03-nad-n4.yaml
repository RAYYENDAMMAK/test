# ─────────────────────────────────────────────────────────────────────────────
#  NetworkAttachmentDefinition — N4 Interface (PFCP)
#
#  Used by: SMF (client) and UPF (server)
#  Protocol: UDP / port 8805
#  Purpose:  SMF ↔ UPF session management (PDU session create/modify/delete)
#
#  Uses ipvlan (L2) on the host management interface — keeps PFCP traffic
#  on an isolated internal segment without needing a dedicated physical port.
#
#  ⚠ Set "master" to your primary host interface (usually eth0 / ens3).
#    SMF  → 192.168.30.10/24  (net1 inside smf pod)
#    UPF  → 192.168.30.20/24  (net2 inside upf pod)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nad-n4
  namespace: open5gs
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name":       "nad-n4",
      "type":       "ipvlan",
      "master":     "eth0",
      "mode":       "l2",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.30.0/24",
        "range_start": "192.168.30.10",
        "range_end":   "192.168.30.30"
      }
    }
