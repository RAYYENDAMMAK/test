apiVersion: v1
kind: ConfigMap
metadata:
  name: ausf-config
  namespace: open5gs
data:
  ausf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/ausf.log
      level: info

    ausf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      serving:
        - plmn_id:
            mcc: "001"
            mnc: "01"
