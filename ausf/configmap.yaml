apiVersion: v1
kind: ConfigMap
metadata:
  name: ausf-config
  namespace: open5gs
data:
  ausf.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/ausf.log
      level: info

    ausf:
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      serving:
        - plmn_id:
            mcc: "999"
            mnc: "70"
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    sed "s/\${POD_IP}/${POD_IP}/g" /etc/open5gs/ausf.yaml.in > /tmp/ausf.yaml
    exec open5gs-ausfd -c /tmp/ausf.yaml
