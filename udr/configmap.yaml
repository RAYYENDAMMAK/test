apiVersion: v1
kind: ConfigMap
metadata:
  name: udr-config
  namespace: open5gs
data:
  udr.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/udr.log
      level: info

    udr:
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
        client:
          scp:
            - uri: http://${SCP_IP}:7777
      serving:
        - plmn_id:
            mcc: "999"
            mnc: "70"

    db_uri: mongodb://192.168.1.102/open5gs
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    SCP_IP="$(getent ahostsv4 scp-svc | awk 'NR==1 {print $1}')"
    sed "s/\${POD_IP}/${POD_IP}/g; s/\${SCP_IP}/${SCP_IP}/g" /etc/open5gs/udr.yaml.in > /tmp/udr.yaml
    exec open5gs-udrd -c /tmp/udr.yaml
