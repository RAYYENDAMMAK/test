apiVersion: v1
kind: ConfigMap
metadata:
  name: udr-config
  namespace: open5gs
data:
  udr.yaml: |
    logger:
      file:
        path: /var/log/open5gs/udr.log
      level: info

    udr:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      serving:
        - plmn_id:
            mcc: "001"
            mnc: "01"

    db_uri: mongodb://mongodb-svc/open5gs
