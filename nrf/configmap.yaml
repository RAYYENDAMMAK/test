apiVersion: v1
kind: ConfigMap
metadata:
  name: nrf-config
  namespace: open5gs
data:
  nrf.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/nrf.log
      level: info

    global:
      max:
        ue: 1024

    nrf:
      serving:
        - plmn_id:
            mcc: "999"
            mnc: "70"
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    sed "s/\${POD_IP}/${POD_IP}/g" /etc/open5gs/nrf.yaml.in > /tmp/nrf.yaml
    exec open5gs-nrfd -c /tmp/nrf.yaml
