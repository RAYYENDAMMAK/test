apiVersion: v1
kind: Service
metadata:
  name: upf-svc
  namespace: open5gs
spec:
  selector:
    app: upf
  ports:
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
    - name: metrics
      port: 9090
      targetPort: 9090
