apiVersion: v1
kind: ConfigMap
metadata:
  name: udm-config
  namespace: open5gs
data:
  udm.yaml: |
    logger:
      file:
        path: /var/log/open5gs/udm.log
      level: info

    udm:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      serving:
        - plmn_id:
            mcc: "001"
            mnc: "01"
