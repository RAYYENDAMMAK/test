apiVersion: v1
kind: ConfigMap
metadata:
  name: udm-config
  namespace: open5gs
data:
  udm.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/udm.log
      level: info

    udm:
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      serving:
        - plmn_id:
            mcc: "999"
            mnc: "70"
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    sed "s/\${POD_IP}/${POD_IP}/g" /etc/open5gs/udm.yaml.in > /tmp/udm.yaml
    exec open5gs-udmd -c /tmp/udm.yaml
