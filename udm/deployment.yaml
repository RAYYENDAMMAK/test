apiVersion: apps/v1
kind: Deployment
metadata:
  name: udm
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udm
  template:
    metadata:
      labels:
        app: udm
    spec:
      containers:
        - name: udm
          image: open5gs:local
          imagePullPolicy: Never
          command: ["open5gs-udmd", "-c", "/etc/open5gs/udm.yaml"]
          ports:
            - containerPort: 7777
          volumeMounts:
            - name: udm-config
              mountPath: /etc/open5gs/udm.yaml
              subPath: udm.yaml
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: udm-config
          configMap:
            name: udm-config
