apiVersion: v1
kind: ConfigMap
metadata:
  name: nssf-config
  namespace: open5gs
data:
  nssf.yaml: |
    logger:
      file:
        path: /var/log/open5gs/nssf.log
      level: info

    nssf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      nsi:
        - uri: http://nrf-svc:7777
          s_nssai:
            sst: 1
            sd: "000001"
