apiVersion: v1
kind: ConfigMap
metadata:
  name: nssf-config
  namespace: open5gs
data:
  nssf.yaml: |
    logger:
      file: /var/log/open5gs/nssf.log
      level: info

    nssf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          nrf:
            - uri: http://nrf-svc:7777
      serving:
        - plmn_id:
            mcc: "001"
            mnc: "01"
          tai:
            - plmn_id:
                mcc: "001"
                mnc: "01"
              tac: 1
          s_nssai:
            - sst: 1
              sd: "000001"
              nrf:
                - uri: http://nrf-svc:7777
