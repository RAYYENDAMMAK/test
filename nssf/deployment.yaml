apiVersion: apps/v1
kind: Deployment
metadata:
  name: nssf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nssf
  template:
    metadata:
      labels:
        app: nssf
    spec:
      containers:
        - name: nssf
          image: open5gs:local
          imagePullPolicy: Never
          command: ["/bin/sh", "/etc/open5gs/run.sh"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 7777
          volumeMounts:
            - name: nssf-config
              mountPath: /etc/open5gs
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: nssf-config
          hostPath:
            path: /home/rayen/ieee_5g_core/nssf
            type: Directory
