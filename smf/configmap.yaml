apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-config
  namespace: open5gs
data:
  smf.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/smf.log
      level: info

    smf:
      info:
        - s_nssai:
            - sst: 1
              dnn:
                - internet
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
        client:
          nrf:
            - uri: http://${NRF_IP}:7777
      pfcp:
        server:
          - address: 0.0.0.0
        client:
          upf:
            - address: upf-svc
      gtpc:
        server:
          - address: 0.0.0.0
      gtpu:
        server:
          - address: 0.0.0.0
      metrics:
        server:
          - address: 0.0.0.0
            port: 9090
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          dnn: internet
      dns:
        - 8.8.8.8
        - 8.8.4.4
      mtu: 1400
#      freeDiameter: /etc/freeDiameter/smf.conf
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    NRF_IP="$(getent ahostsv4 nrf-svc | awk 'NR==1 {print $1}')"
    sed "s/\${POD_IP}/${POD_IP}/g; s/\${NRF_IP}/${NRF_IP}/g" /etc/open5gs/smf.yaml.in > /tmp/smf.yaml
    exec open5gs-smfd -c /tmp/smf.yaml
