apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-config
  namespace: open5gs
data:
  smf.yaml.in: |
    logger:
      file:
        path: /var/log/open5gs/smf.log
      level: info

    smf:
      info:
        - s_nssai:
            - sst: 1
              dnn:
                - internet
      sbi:
        server:
          - address: ${POD_IP}
            port: 7777
        client:
          scp:
            - uri: http://${SCP_IP}:7777
      pfcp:
        server:
          - address: ${POD_IP}
        client:
          upf:
            - address: ${UPF_IP}
      gtpc:
        server:
          - address: ${POD_IP}
      gtpu:
        server:
          - address: ${POD_IP}
      metrics:
        server:
          - address: ${POD_IP}
            port: 9090
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          dnn: internet
      dns:
        - 8.8.8.8
        - 8.8.4.4
      mtu: 1400
    #      freeDiameter: /etc/freeDiameter/smf.conf
  run.sh: |
    #!/bin/sh
    set -eu
    : "${POD_IP:?POD_IP is required}"
    SCP_IP="$(getent ahostsv4 scp-svc | awk 'NR==1 {print $1}')"
    UPF_IP="$(getent ahostsv4 upf-svc | awk 'NR==1 {print $1}')"
    sed "s/\${POD_IP}/${POD_IP}/g; s/\${SCP_IP}/${SCP_IP}/g; s/\${UPF_IP}/${UPF_IP}/g" /etc/open5gs/smf.yaml.in > /tmp/smf.yaml
    exec open5gs-smfd -c /tmp/smf.yaml
