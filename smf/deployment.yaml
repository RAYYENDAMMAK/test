apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smf
  template:
    metadata:
      labels:
        app: smf
      annotations:
        # ── Multus N4 interface (PFCP) ────────────────────────────────────────
        # net1: ipvlan on management NIC — PFCP session control to UPF/8805
        # IP dynamically assigned by whereabouts from 192.168.30.10-30 range
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name":      "nad-n4",
            "namespace": "open5gs",
            "interface": "net1"
          }]
    spec:
      containers:
        - name: smf
          image: open5gs:local
          imagePullPolicy: Never
          command: ["/bin/sh", "/etc/open5gs/run.sh"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: sbi
              containerPort: 7777
            - name: pfcp
              containerPort: 8805
              protocol: UDP
            - name: gtpc
              containerPort: 2123
              protocol: UDP
            - name: gtpu
              containerPort: 2152
              protocol: UDP
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: smf-config
              mountPath: /etc/open5gs
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: smf-config
          hostPath:
            path: /home/rayen/ieee_5g_core/smf
            type: Directory
