apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-ui
  namespace: open5gs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-ui-role
  namespace: open5gs
rules:
  # Read deployments, pods, services
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "nodes", "configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Allow pod deletion for restart
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-ui-rolebinding
  namespace: open5gs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-ui-role
subjects:
  - kind: ServiceAccount
    name: core-ui
    namespace: open5gs
---
# Node read access (cluster-level)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: core-ui-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: core-ui-node-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: core-ui-node-reader
subjects:
  - kind: ServiceAccount
    name: core-ui
    namespace: open5gs
