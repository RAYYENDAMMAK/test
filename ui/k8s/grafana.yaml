apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: open5gs
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-ds
        url: http://prometheus-svc:9090
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
      - name: Loki
        type: loki
        uid: loki-ds
        url: http://loki-svc:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: open5gs
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Open5GS
        type: file
        options:
          path: /etc/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: publicDashboards
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-overview
              mountPath: /etc/grafana/dashboards/overview
            - name: grafana-dashboard-amf
              mountPath: /etc/grafana/dashboards/amf
            - name: grafana-dashboard-smf
              mountPath: /etc/grafana/dashboards/smf
            - name: grafana-dashboard-upf
              mountPath: /etc/grafana/dashboards/upf
            - name: grafana-storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboard-overview
          configMap:
            name: grafana-dashboard-overview
        - name: grafana-dashboard-amf
          configMap:
            name: grafana-dashboard-amf
        - name: grafana-dashboard-smf
          configMap:
            name: grafana-dashboard-smf
        - name: grafana-dashboard-upf
          configMap:
            name: grafana-dashboard-upf
        - name: grafana-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: open5gs
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer
