apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-ue-config
  namespace: open5gs
data:
  ue-template.yaml: |
    supi: 'imsi-999700000000001'
    mcc: '999'
    mnc: '70'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'

    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'

    tunNetmask: '255.255.255.0'

    gnbSearchList:
      - ${GNB_RLS_IP}

    uacAic:
      mps: false
      mcs: false

    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 1
          sd: '000001'

    configured-nssai:
      - sst: 1
        sd: '000001'

    default-nssai:
      - sst: 1
        sd: '000001'
    integrity:
      IA1: true
      IA2: true
      IA3: true

    ciphering:
      EA1: true
      EA2: true
      EA3: true

    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
  run-ue.sh: |
    #!/bin/sh
    set -eu

    GNB_RLS_IP="$(getent ahostsv4 ueransim-gnb-0.ueransim-gnb.open5gs.svc.cluster.local | awk 'NR==1 {print $1}')"

    if [ -z "${GNB_RLS_IP}" ]; then
      echo "Failed to resolve ueransim-gnb-0.ueransim-gnb.open5gs.svc.cluster.local" >&2
      exit 1
    fi

    export GNB_RLS_IP

    envsubst < /etc/ueransim/ue-template.yaml > /tmp/ue.yaml

    exec nr-ue -c /tmp/ue.yaml -l
