# ─────────────────────────────────────────────────────────────
#  Promtail DaemonSet — ships k3s pod logs to Loki
#  Reads /var/log/pods/ on each node, uses k8s SD to tag
#  logs with namespace, pod, container, and app labels.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: open5gs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: open5gs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: open5gs
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/promtail-positions.yaml

    clients:
      - url: http://loki-svc:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 1048576

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [open5gs]

        pipeline_stages:
          - docker: {}
          - drop:
              expression: '^\s*$'   # drop empty lines

        relabel_configs:
          # Only scrape pods with a running container
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running

          # Node name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__

          # Namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          # Pod name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          # Container name
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          # app label → nf (e.g. amf, smf, upf)
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: nf

          # Log file path on node
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1*/$2/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: open5gs
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:latest
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          ports:
            - containerPort: 9080
              name: http
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
